name: analyze-licenses

on:
  push:
    branches: [main]
    paths:
      - 'renv.lock'
      - 'DESCRIPTION'
  pull_request:
    branches: [main]
    paths:
      - 'renv.lock'
      - 'DESCRIPTION'
  workflow_dispatch:

jobs:
  analyze-licenses:
    runs-on: atmos-aws-arc-runner-set
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Sanofi CA
        uses: sanofi-InnerSource/github-actions-library/setup-root-ca@main

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - name: Run analyze-licenses action
        uses: Sanofi-GitHub/spar-actions-risk.assessr/analyze-licenses@main
