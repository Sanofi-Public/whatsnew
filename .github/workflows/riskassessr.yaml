name: Risk validation and README badges

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  risk-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Sanofi CA (optional)
        uses: sanofi-InnerSource/github-actions-library/setup-root-ca@main

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install R package dependencies (for R CMD build / vignettes)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build R package tarball (package_build/)
        run: |
          set -euo pipefail
          mkdir -p package_build
          R CMD build .
          PKG_TARBALL=$(ls -1t *.tar.gz | head -1)
          mv "$PKG_TARBALL" "package_build/"
          echo "PKG_TARBALL=$PKG_TARBALL" >> "$GITHUB_ENV"
          echo "Built: package_build/$PKG_TARBALL"

      - name: Run package validation (inst/risk_report)
        uses: Sanofi-GitHub/spar-actions-risk.assessr/package_validation@main
        with:
          package_path: ${{ github.workspace }}/package_build/${{ env.PKG_TARBALL }}
          r_repos: |
            options(repos = c(
              RSPM = "https://rstudio-pm.prod.p488440267176.aws-emea.sanofi.com/prod-cran/latest",
              INTERNAL = "https://rstudio-pm.prod.p488440267176.aws-emea.sanofi.com/art-git/latest",
              INTERNAL_RSPM = "https://rstudio-pm.prod.p488440267176.aws-emea.sanofi.com"
            ))
            
      - name: Generate README badges from inst/risk_report
        uses: Sanofi-GitHub/spar-actions-risk.assessr/generate-risk-badge@main
        with:
          github_token: ${{ secrets.GIT_PAT }}


